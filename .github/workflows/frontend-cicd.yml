name: Banking Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload Production Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to AWS S3 and CloudFront
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_AWS_DEPLOY == 'true'

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Validate AWS Deployment Configuration
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in AWS_REGION S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID AWS_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub production environment setting: ${name}"
              exit 1
            fi
          done
          if [[ ! -f dist/index.html ]]; then
            echo "::error::dist/index.html was not found."
            exit 1
          fi

      - name: Configure AWS Credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy static files to S3
        shell: bash
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail

          # Sync non-HTML root files (for example favicon and manifest).
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --exclude "assets/*"

          # Vite assets are content-hashed, so they can be cached for one year.
          if [[ -d dist/assets ]]; then
            aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets/" \
              --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi

          # Keep the SPA entry point revalidating so deployments become visible quickly.
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/" "/index.html"
